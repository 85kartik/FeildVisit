<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LMS Student Perception Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f7fb;--surface:#fff;--text:#172033;--muted:#64748b;
  --primary:#4f46e5;--primary2:#7c3aed;--border:#e7eaf0;
  --shadow:0 10px 30px rgba(15,23,42,.07);--radius:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,#f7f8fc 0,#f3f6fb 100%);
color:var(--text);font-family:Inter,Arial,sans-serif;font-size:14px}
button,select{font:inherit}
button{border:0;cursor:pointer}
header{
  position:relative;overflow:hidden;color:#fff;
  background:linear-gradient(135deg,#111827,#312e81 65%,#5b21b6);
  padding:30px max(20px,5vw);box-shadow:0 10px 35px rgba(49,46,129,.18)
}
header:after{
  content:"";position:absolute;width:260px;height:260px;border-radius:50%;
  right:-90px;top:-110px;background:rgba(255,255,255,.09)
}
.hero{position:relative;z-index:1;max-width:1450px;margin:auto}
.badge{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid rgba(255,255,255,.2);
border-radius:999px;background:rgba(255,255,255,.1);font-size:11px;font-weight:700;letter-spacing:.3px}
h1{margin:12px 0 7px;font-size:clamp(23px,3vw,34px);line-height:1.15;letter-spacing:-.7px}
header p{margin:0;color:#dbeafe;font-size:13px;line-height:1.6}
.container{width:min(1450px,92%);margin:24px auto 50px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.btn{padding:11px 15px;border-radius:12px;background:var(--primary);color:#fff;font-weight:800;
box-shadow:0 6px 15px rgba(79,70,229,.2);transition:.2s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.04)}
.btn.secondary{background:#fff;color:#263044;border:1px solid var(--border);box-shadow:none}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}
.card,.chart-card,.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card{padding:17px;min-width:0}
.label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.45px}
.value{font-size:26px;font-weight:800;margin-top:8px;letter-spacing:-.5px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.summary .card{min-height:95px}
.summary strong{display:block;margin-top:8px;font-size:15px;line-height:1.35}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.chart-card{padding:18px;min-height:350px;cursor:pointer;transition:.2s}
.chart-card:hover{transform:translateY(-2px);box-shadow:0 15px 35px rgba(15,23,42,.10)}
.chart-card h3{font-size:14px;margin:0 0 12px;line-height:1.35}
.chart-wrap{height:285px;position:relative}
.panel{margin-top:22px;padding:18px;overflow:hidden}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.panel h2{font-size:18px;margin:0 0 5px}
.muted{color:var(--muted);font-size:12px;line-height:1.5}
.table-wrap{overflow:auto;max-height:560px;border:1px solid var(--border);border-radius:12px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;min-width:1100px}
th,td{padding:10px;border-bottom:1px solid #eef2f7;text-align:left;vertical-align:top;line-height:1.45}
th{position:sticky;top:0;background:#f8fafc;color:#334155;font-weight:800;z-index:2}
tr:last-child td{border-bottom:0}
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.72);z-index:20;padding:3vh 4vw}
.modal-box{background:#fff;border-radius:18px;height:94vh;padding:18px;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.modal-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.modal-top h2{font-size:18px;margin:0}
.modal-actions{display:flex;align-items:center;gap:8px}
select{padding:9px 11px;border:1px solid #d7dce5;border-radius:10px;background:#fff;color:#111827}
.modal-chart{flex:1;min-height:0}
.close{background:#111827;color:#fff;padding:9px 13px;border-radius:10px;font-weight:800}
@media(max-width:1100px){
 .stats{grid-template-columns:repeat(3,1fr)}.summary{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:760px){
 header{padding:24px 18px}
 .container{width:94%;margin-top:16px}
 .stats,.summary,.charts{grid-template-columns:1fr}
 .card{padding:15px}.value{font-size:24px}
 .chart-card{min-height:320px;padding:15px}.chart-wrap{height:250px}
 .toolbar .btn{flex:1;min-width:145px}
 .panel{padding:14px}.panel-head{display:block}
 .modal{padding:10px}.modal-box{height:96vh;padding:12px}
 .modal-top{align-items:flex-start}.modal-actions{flex-wrap:wrap;justify-content:flex-end}
}
@media(max-width:430px){
 body{font-size:13px}h1{font-size:23px}
 header p{font-size:12px}.badge{font-size:10px}
 .toolbar{gap:8px}.toolbar .btn{width:100%}
 .chart-card{min-height:300px}.chart-wrap{height:225px}
 .panel h2{font-size:16px}
}
</style>
</head>
<body>
<header>
  <div class="hero">
    <span class="badge">📊 LMS RESEARCH DASHBOARD</span>
    <h1>Student Perception of Learning Management Systems</h1>
    <p>Higher Education • Updated survey dataset • Responsive analytics dashboard</p>
  </div>
</header>

<main class="container">
  <div class="toolbar">
    <button class="btn" onclick="render()">↻ Refresh Dashboard</button>
    <button class="btn secondary" onclick="downloadCSV()">↓ Download CSV</button>
  </div>

  <div id="stats" class="stats"></div>
  <div id="summary" class="summary"></div>
  <div id="charts" class="charts"></div>

  <section class="panel">
    <div class="panel-head">
      <div>
        <h2>Survey Responses</h2>
        <div id="rowInfo" class="muted"></div>
      </div>
    </div>
    <div class="table-wrap">
      <table><thead id="thead"></thead><tbody id="tbody"></tbody></table>
    </div>
  </section>
</main>

<div id="modal" class="modal">
  <div class="modal-box">
    <div class="modal-top">
      <h2 id="modalTitle">Chart</h2>
      <div class="modal-actions">
        <select id="chartType">
          <option value="bar">Bar</option><option value="doughnut">Doughnut</option>
          <option value="pie">Pie</option><option value="line">Line</option>
        </select>
        <button class="close" onclick="closeModal()">Close</button>
      </div>
    </div>
    <div class="modal-chart"><canvas id="modalCanvas"></canvas></div>
  </div>
</div>

let charts=[],modalChart=null,modalConfig=null;

const Q={
 gender:"Gender",faculty:"Faculty / Stream",year:"Year of Study",
 use:"1.Do you use a Learning Management System",
 platform:"2.Which LMS do you mainly use",frequency:"3.How frequently do you use the LMS",
 ease:"4.How easy is the LMS to use",materials:"5.Is it easy to find study materials",
 useful:"6.How useful is the LMS",convenient:"8. Is submitting assignments",
 communication:"9.Does the LMS help you communicate",
 tracking:"10. Does the LMS help you keep track",
 mobile:"11. Can you access the LMS easily",reliability:"12.How reliable is the LMS",
 problems:"13. What problems do you face",improve:"14.Does the LMS improve",
 satisfaction:"15.Overall, how satisfied"
};
const key=frag=>Object.keys(DATA[0]||{}).find(k=>k.toLowerCase().includes(frag.toLowerCase()));
const val=(r,f)=>key(f)?String(r[key(f)]??"").trim():"";
function counts(f){let o={};DATA.forEach(r=>{let v=val(r,f)||"Not specified";o[v]=(o[v]||0)+1});return o}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function colors(n){
 const a=["#4f46e5","#7c3aed","#059669","#f59e0b","#ef4444","#0891b2","#db2777","#65a30d","#2563eb","#9333ea"];
 return Array.from({length:n},(_,i)=>a[i%a.length]);
}
function pct(f,allowed){
 const n=DATA.length||1;
 return Math.round(DATA.filter(r=>allowed.includes(val(r,f))).length/n*100);
}

function addChart(title,frag,type="bar",horizontal=false){
 const id="c"+Math.random().toString(36).slice(2);
 const card=document.createElement("div");
 card.className="chart-card";
 card.innerHTML=`<h3>${esc(title)}</h3><div class="chart-wrap"><canvas id="${id}"></canvas></div>`;
 document.getElementById("charts").appendChild(card);

 const c=counts(frag),labels=Object.keys(c),values=Object.values(c);
 const cfg={
   type,
   data:{labels,datasets:[{label:title,data:values,backgroundColor:colors(values.length),
   borderColor:"#ffffff",borderWidth:1,borderRadius:type==="bar"?6:0}]},
   options:{
     responsive:true,maintainAspectRatio:false,
     indexAxis:horizontal?"y":"x",
     scales:(type==="pie"||type==="doughnut")?{}:{
       x:{ticks:{font:{size:10},maxRotation:45},grid:{color:"#eef2f7"}},
       y:{beginAtZero:true,ticks:{font:{size:10}},grid:{color:"#eef2f7"}}
     },
     plugins:{
       legend:{display:type==="pie"||type==="doughnut",position:"bottom",labels:{font:{size:11}}},
       datalabels:{display:type==="pie"||type==="doughnut",color:"#fff",font:{weight:"700",size:11}}
     }
   },
   plugins:[ChartDataLabels]
 };
 const ch=new Chart(document.getElementById(id),cfg);
 charts.push(ch);
 card.onclick=()=>openModal(title,cfg);
}

function render(){
 charts.forEach(c=>c.destroy());charts=[];
 document.getElementById("charts").innerHTML="";
 const n=DATA.length;

 document.getElementById("stats").innerHTML=[
   ["Total Responses",n],
   ["Useful / Very Useful",pct(Q.useful,["Useful","Very Useful"])+"%"],
   ["Easy / Very Easy",pct(Q.ease,["Easy","Very Easy"])+"%"],
   ["Reliable / Very Reliable",pct(Q.reliability,["Reliable","Very Reliable"])+"%"],
   ["Satisfied / Very Satisfied",pct(Q.satisfaction,["Satisfied","Very Satisfied"])+"%"]
 ].map(x=>`<div class="card"><div class="label">${esc(x[0])}</div><div class="value">${esc(x[1])}</div></div>`).join("");

 const p=counts(Q.problems);
 const priority=Object.entries(p).sort((a,b)=>b[1]-a[1])[0]?.[0]||"—";
 document.getElementById("summary").innerHTML=[
   ["LMS adoption",pct(Q.use,["Yes"])+"%"],
   ["Learning improved",pct(Q.improve,["Yes","To some extent"])+"%"],
   ["Ease reported",pct(Q.ease,["Easy","Very Easy"])+"%"],
   ["Most reported issue",priority]
 ].map(x=>`<div class="card"><div class="label">${esc(x[0])}</div><strong>${esc(x[1])}</strong></div>`).join("");

 addChart("Gender",Q.gender,"doughnut");
 addChart("Academic Year",Q.year);
 addChart("Faculty / Stream",Q.faculty);
 addChart("LMS Adoption",Q.use,"doughnut");
 addChart("Main LMS Platform",Q.platform,"bar",true);
 addChart("LMS Usage Frequency",Q.frequency);
 addChart("Ease of Use",Q.ease,"doughnut");
 addChart("Study Material Usefulness",Q.useful);
 addChart("Assignment Submission Convenience",Q.convenient);
 addChart("Teacher Communication",Q.communication);
 addChart("Assignment / Deadline Tracking",Q.tracking);
 addChart("Mobile Access",Q.mobile,"doughnut");
 addChart("LMS Reliability",Q.reliability,"doughnut");
 addChart("Learning Experience Improvement",Q.improve,"doughnut");
 addChart("Overall Satisfaction",Q.satisfaction,"doughnut");
 addChart("Reported Problems",Q.problems,"bar",true);

 document.getElementById("rowInfo").textContent=`${n} responses loaded from the updated dataset`;

 const hs=Object.keys(DATA[0]||{});
 document.getElementById("thead").innerHTML="<tr>"+hs.map(h=>`<th>${esc(h)}</th>`).join("")+"</tr>";
 document.getElementById("tbody").innerHTML=DATA.map(r=>"<tr>"+hs.map(h=>`<td>${esc(r[h]||"")}</td>`).join("")+"</tr>").join("");
}

function openModal(title,cfg){
 document.getElementById("modal").style.display="block";
 document.getElementById("modalTitle").textContent=title;
 modalConfig=JSON.parse(JSON.stringify(cfg));
 if(modalChart)modalChart.destroy();
 modalChart=new Chart(document.getElementById("modalCanvas"),modalConfig);
}
function closeModal(){document.getElementById("modal").style.display="none"}
document.getElementById("chartType").onchange=function(){
 if(!modalConfig)return;
 modalConfig.type=this.value;
 if(modalChart)modalChart.destroy();
 modalChart=new Chart(document.getElementById("modalCanvas"),modalConfig);
}
function downloadCSV(){
 const hs=Object.keys(DATA[0]||{});
 const csv=[hs,...DATA.map(r=>hs.map(h=>`"${String(r[h]||"").replace(/"/g,'""')}"`))]
   .map(r=>r.join(",")).join("\n");
 const a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
 a.download="lms_updated_survey_data.csv";a.click();
 URL.revokeObjectURL(a.href);
}
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
render();
</script>
