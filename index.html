function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function colors(n){let a=["#2563eb","#7c3aed","#059669","#d97706","#dc2626","#0891b2","#db2777","#65a30d","#4f46e5","#9333ea"];return Array.from({length:n},(_,i)=>a[i%a.length])}

function addChart(title,frag,type="bar",horizontal=false){
 let id="c"+Math.random().toString(36).slice(2), card=document.createElement("div");
 card.className="chart-card";card.innerHTML=`<h3>${esc(title)}</h3><div class="chart-wrap"><canvas id="${id}"></canvas></div>`;
 chartsBox.appendChild(card);let c=counts(frag),labels=Object.keys(c),values=Object.values(c);
 let cfg={type,data:{labels,datasets:[{label:title,data:values,backgroundColor:colors(values.length),borderWidth:1}]},
 options:{responsive:true,maintainAspectRatio:false,indexAxis:horizontal?"y":"x",

 let ch=new Chart(document.getElementById(id),cfg);charts.push(ch);card.onclick=()=>openModal(title,cfg)
}
